[workspace]
resolver = "3"
members = ["evtc-ingest", "evtc-oracle", "ei-data", "ei-core", "ei-cli", "ei-parity"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/baaron4/GW2-Elite-Insights-Parser"
authors = ["GW2 Elite Insights contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
